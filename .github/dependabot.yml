version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive together; there is rarely a reason to
      # look at them one at a time.
      go-minor-patch:
        update-types:
          - minor
          - patch
      # Majors are grouped separately rather than ignored. Ignoring them is why
      # this repository sat five Vite majors and three TypeScript majors behind
      # while every dependency PR looked green. They need reading before
      # merging, which is an argument for a separate pile, not for silence.
      go-major:
        update-types:
          - major
    commit-message:
      prefix: gomod
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # See the note on go-major above.
      npm-major:
        update-types:
          - major
    commit-message:
      prefix: npm
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
      actions-major:
        update-types:
          - major
    commit-message:
      prefix: actions
      include: scope

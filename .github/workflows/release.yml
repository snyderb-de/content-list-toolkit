name: build-release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION_FILE: go.mod
  WAILS_VERSION: v2.16.0
  NODE_VERSION: '24'

jobs:
  unix-bundle:
    name: macOS GUI + TUI + Linux TUI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Frontend tests
        run: npm --prefix frontend ci && npm --prefix frontend run test

      - name: Build releases (mac TUI + GUI universal, linux TUI)
        run: ./scripts/build_releases.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: releases/macos/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: releases/linux/
          if-no-files-found: error

  windows-gui:
    name: Windows Wails GUI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        env:
          WAILS_VER: ${{ env.WAILS_VERSION }}
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$env:WAILS_VER"
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Wails doctor
        shell: pwsh
        run: wails doctor

      - name: Build Wails GUI
        shell: pwsh
        run: wails build -platform windows/amd64 -clean -webview2 download -o "content-list-generator.exe"

      - name: Stage Windows GUI outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases\windows-go | Out-Null
          Copy-Item "build\bin\content-list-generator.exe" "releases\windows-go\content-list-generator.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-go
          path: releases/windows-go/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unix-bundle, windows-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts into releases/
        uses: actions/download-artifact@v8
        with:
          path: releases

      - name: Show staged release assets
        run: find releases -type f -not -name '.gitkeep' | sort

      - name: Publish via gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: ./scripts/publish_github_release.sh "$TAG_NAME" --target main
